<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>LumaWindow · 第二阶段视觉检查</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #172330;
      color: #eee;
      font: 13px system-ui;
    }
    header {
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    input {
      width: 88px;
    }
    button,
    select,
    input {
      padding: 5px;
    }
    #world {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
    }
    #detail {
      width: 100%;
      height: 210px;
      display: block;
      background: #bbc4c7;
    }
    output {
      white-space: pre-wrap;
    }
    p {
      margin: 10px 16px;
    }
  </style>
  <header>
    <label>种子 <input id="seed" type="number" value="8472" /></label
    ><label
      >旅程位置
      <input id="distance" type="number" value="0" step="720" /></label
    ><label
      >时段
      <select id="phase">
        <option value="0.30">黎明</option>
        <option value="0.48">白天</option>
        <option value="0.74" selected>暖霞</option>
        <option value="0.84">蓝调</option>
        <option value="0">月夜</option>
      </select></label
    ><label
      >云量
      <input
        id="clouds"
        type="number"
        min="0"
        max="1"
        step=".1"
        value=".64" /></label
    ><label
      >云形
      <input
        id="shape"
        type="number"
        min="0"
        max="1"
        step=".1"
        value=".6" /></label
    ><label
      >雾感
      <input
        id="fog"
        type="number"
        min="0"
        max="1"
        step=".1"
        value=".28" /></label
    ><button id="apply">生成固定样板</button
    ><button id="play">播放 / 暂停</button><output id="stats"></output>
  </header>
  <canvas id="world" aria-label="实际场景"></canvas>
  <p>同一列车几何的侧面放大检查（全景决定最终观看效果）</p>
  <canvas id="detail" aria-label="客运列车侧面结构"></canvas>
  <script type="module">
    // Development-only deterministic visual review. No production routing or hooks.
    import * as T from "three";
    import { SceneEngine } from "../../packages/scene-engine/src/index.ts";
    import {
      defaults,
      validateParams,
    } from "../../scenes/cloudsea-railway/params.ts";
    import { createPassengerTrain } from "../../scenes/cloudsea-railway/train.ts";
    import { createLighting } from "../../scenes/cloudsea-railway/lighting.ts";
    const by = (id) => document.getElementById(id),
      value = (id) => Number(by(id).value);
    const engine = new SceneEngine(
      by("world"),
      (e) => (by("stats").textContent = e),
    );
    engine.paused = true;
    engine.start();
    const renderer = new T.WebGLRenderer({
      canvas: by("detail"),
      antialias: true,
    });
    renderer.setClearColor("#bbc4c7");
    renderer.outputColorSpace = T.SRGBColorSpace;
    const train = createPassengerTrain(),
      lighting = createLighting(),
      scene = new T.Scene(),
      camera = new T.OrthographicCamera(-640, 95, 82, -40, 0.1, 1000);
    camera.position.z = 100;
    scene.add(train.group);
    function detail() {
      renderer.setSize(by("detail").clientWidth, 210, false);
      renderer.render(scene, camera);
    }
    async function render() {
      const seed = value("seed"),
        phase = value("phase"),
        distance = value("distance");
      const params = validateParams({
        ...defaults,
        timeMode: "fixed",
        daylight: phase,
        clouds: value("clouds"),
        cloudShape: value("shape"),
        fog: value("fog"),
      });
      engine.paused = true;
      await engine.load(
        async () => {
          const module = await import("../../scenes/cloudsea-railway/scene.ts");
          return {
            create: (ctx) =>
              module.create({
                ...ctx,
                state: { seed, distance, phase, windDistance: 0 },
              }),
          };
        },
        "side",
        seed,
        params,
      );
      engine.resize();
      lighting.update(phase);
      train.update(lighting, 0);
      detail();
      by("stats").textContent = JSON.stringify(engine.instance?.stats());
    }
    by("apply").onclick = render;
    by("play").onclick = () => {
      engine.paused = !engine.paused;
    };
    new ResizeObserver(() => {
      engine.resize();
      detail();
    }).observe(by("world"));
    await render();
    addEventListener("pagehide", () => {
      engine.dispose();
      train.dispose();
      renderer.dispose();
    });
  </script>
</html>
